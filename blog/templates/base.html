{% load static %} 
<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>БЛОГ ОБ ИЗУЧЕНИИ DJANGO</h1>
                
            </div>
        </header>

        <aside class="sidebar">
            <nav class="nav">
                <ul>
                    {% for key, value in menu.items %}
                    <li><a href="{{value}}">{{key}}</a></li>
                    {% endfor %}
                    <img src="{% url 'logo_image' %}" alt="Лого">
                </ul>
            </nav>
        </aside>

        <main class="main">
            <div class="content">
                {% block content %}
                {% endblock %}
            </div>
   
           
        </main>
        
        <footer class="footer">
        <h4>Коровкина Лидия 2-МГ3-2</h4>
        <h5>2025</h4>
        </footer>
    </div>
</body>
</html>
